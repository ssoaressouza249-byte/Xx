name: Build APK Ower OTMX

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d temp_extract
            if [ -f "temp_extract/settings.gradle.kts" ] || [ -f "temp_extract/settings.gradle" ]; then
              cp -rf temp_extract/* .
            else
              SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -rf "$SUBDIR"/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi

      - name: Fix AndroidManifest and clean template extras
        run: |
          MANIFEST_PATH=$(find . -path "*/src/main/AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST_PATH" ]; then
            python3 -c '
import sys
path = sys.argv[1]
content = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://android.com"
    xmlns:tools="http://android.com">

    <uses-permission
        android:name="android.permission.QUERY_ALL_PACKAGES"
        tools:ignore="QueryAllPackagesPermission" />

    <queries>
        <package android:name="moe.shizuku.privileged.api" />
    </queries>

    <application
        android:allowBackup="true"
        android:dataExtractionRules="@xml/data_extraction_rules"
        android:fullBackupContent="@xml/backup_rules"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:supportsRtl="true"
        android:theme="@style/Theme.OwerOTMX">

        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:label="@string/app_name"
            android:theme="@style/Theme.OwerOTMX"
            android:windowSoftInputMode="adjustResize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

        <provider
            android:name="rikka.shizuku.ShizukuProvider"
            android:authorities="${applicationId}.shizuku"
            android:enabled="true"
            android:exported="true"
            android:multiprocess="false"
            android:permission="android.permission.INTERACT_CROSS_USER_FULL" />
    </application>

</manifest>
"""
open(path, "w", encoding="utf-8").write(content)
print("Manifest atualizado em:", path)
' "$MANIFEST_PATH"
          fi
          find . -name "*.gradle*" -type f -exec sed -i '/google-services/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/secrets-gradle-plugin/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/secrets/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/debug\.keystore/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/compileSdk\s*=\s*[0-9]\+/compileSdk = 36/g' {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ower-OTMX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
